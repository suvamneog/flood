name: Update ASDMA flood data

# Runs twice daily (IST morning + afternoon) and on manual dispatch.
# Scrapes the latest official Daily Flood Report PDF and commits JSON updates.

on:
  schedule:
    # 03:30 UTC ≈ 09:00 IST
    - cron: '30 3 * * *'
    # 10:30 UTC ≈ 16:00 IST
    - cron: '30 10 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install scraper dependencies
        run: pip install -r scripts/requirements.txt

      - name: Scrape latest ASDMA daily PDF
        run: python3 scripts/scrape_asdma_pdf.py --lookback 5

      - name: Commit updated data if changed
        run: |
          if git diff --quiet -- src/data; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "floodassist-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data
          git commit -m "chore: refresh ASDMA flood data $(date -u +%Y-%m-%d)"
          git push
